no_tty: true
colors: false
glob_matcher: doublestar

# The gates for this fork's working branches.
#
# Backend Go changes regenerate derived output before linting it. Frontend changes
# run the frontend gate. Keep these sequential and in this order: backend
# generation can write types that the frontend gate reads.

pre-commit:
  parallel: false
  jobs:
    - name: backend
      glob: "backend/**/*.go"
      # GIT_DIR is unset because git exports it, absolute and without a matching
      # GIT_WORK_TREE, to hooks running in a linked worktree. The lint task then
      # runs with cwd=backend/ and git infers the work tree from cwd, so
      # golangci-lint's new-from-merge-base filter diffs the wrong tree and
      # silently reports the whole repo instead of the branch.
      run: env -u GIT_DIR mise run //backend:lint && env -u GIT_DIR mise run //:generated-check
    - name: frontend
      glob: "frontend/**"
      exclude: ["frontend/**/*.md", "frontend/**/*.toml"]
      run: mise run //frontend:gate
